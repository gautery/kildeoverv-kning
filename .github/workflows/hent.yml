name: Hent nytt fra kildene

on:
  schedule:
    - cron: "17 * * * *"     # hver time, 17 minutter over (UTC)
  workflow_dispatch:          # gjør det mulig å kjøre for hånd fra «Actions»-fanen

permissions:
  contents: write

concurrency:
  group: hent
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer
        run: pip install -r requirements.txt

      - name: Hent fra kildene
        run: python hent.py

      - name: Lagre endringer
        run: |
          git config user.name "kildevakt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs OVERSIKT.md
          if git diff --cached --quiet; then
            echo "Ingenting nytt."
          else
            git commit -m "Nytt fra kildene $(TZ=Europe/Oslo date +'%d.%m.%Y %H:%M')"
            git push
          fi
